        Type:
          type: string
          nullable: true
        LeadSource:
          type: string
          nullable: true
        IsWon:
          type: boolean
          readOnly: true
        IsClosed:
          type: boolean
          readOnly: true
        OwnerId:
          type: string
          readOnly: true
        Pricebook2Id:
          type: string
          nullable: true
        CreatedDate:
          type: string
          format: date-time
          readOnly: true
        LastModifiedDate:
          type: string
          format: date-time
          readOnly: true
