        StageName:
          type: string
          nullable: true
        Amount:
          type: number
          nullable: true
        CloseDate:
          type: string
          format: date
          nullable: true
      description: A summary of a Salesforce Opportunity record for list views.
    Case:
      type: object
      properties:
        Id:
          type: string
          description: The unique, unchangeable 18-character system identifier for
            the Case record.
          readOnly: true
        AccountId:
          type: string
          description: The 18-character ID of the Account (company) this case is associated
            with.
          readOnly: true
        ContactId:
          type: string
          description: The 18-character ID of the Contact (person) this case is associated
            with.
          nullable: true
        CaseNumber:
          type: string
          description: The user-facing, auto-assigned number that identifies the case
            (e.g., '00001234'). This is different from the system 'Id'.
          readOnly: true
        Subject:
          type: string
          description: A brief, one-line summary of the case.
          nullable: true
        Description:
          type: string
          description: A detailed, long-form description of the customer's issue or
            question.
          nullable: true
        Status:
          type: string
          description: The current stage of the case in its lifecycle, such as 'New',
            'In Progress', or 'Closed'.
          nullable: true
        Priority:
          type: string
