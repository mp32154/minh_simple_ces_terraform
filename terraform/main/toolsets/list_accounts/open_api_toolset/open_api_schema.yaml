  /sobjects/Account/{accountId}/Contacts:
    get:
      tags:
      - Contact
      summary: List Contacts for a specific Account.
      description: |
        List Contacts for a specific Account. You MUST use this tool when a user provides an 18-character Account ID.
        This applies even if the user calls it a 'number'. This tool supports optional sorting and limiting.
        You MUST NOT ask for 'limit' or 'orderby' values. Only use them if a user provides terms like "top 5", "bottom 10", "newest", or "oldest".
        For the 'orderby' parameter, you MUST only use one of the following fields for sorting Contacts: 'CreatedDate', 'LastModifiedDate'.
        Usage Examples:
          - To find the NEWEST or OLDEST records, use 'CreatedDate':
            - User says: "show me the 5 newest contacts" -> Agent uses: limit=5, orderby='CreatedDate DESC'
            - User says: "list the 10 oldest contacts" -> Agent uses: limit=10, orderby='CreatedDate ASC'
          - To find the most RECENTLY MODIFIED records, use 'LastModifiedDate':
            - User says: "get the top 3 most recently used contacts" -> Agent uses: limit=3, orderby='LastModifiedDate DESC'
      operationId: listContactsByAccountId
      parameters:
      - name: accountId
        in: path
        description: The 18-character ID of the Account whose contacts you want to
          list. The agent must use this parameter when the user provides an 18-character
          value, regardless of whether they call it an 'ID' or a 'number'.
        required: true
        style: simple
        explode: false
        schema:
          pattern: ^[a-zA-Z0-9]{18}$
          type: string
      - name: limit
        in: query
        description: 'Optional: The maximum number of records to return. Only use
          if the user specifies a limit.'
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: orderby
        in: query
        description: 'Optional: The field to sort by. MUST be one of the fields specified
          in the main description. Only use if the user specifies an order.'
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: A list of contacts for the specified account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListResponse'
        '404':
          description: Not Found - No Account with the specified ID exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
