        StageName:
          type: string
          nullable: true
        CloseDate:
          type: string
          format: date
          nullable: true
        Amount:
          type: number
          nullable: true
        Type:
          type: string
          nullable: true
        LeadSource:
          type: string
          nullable: true
        Pricebook2Id:
          type: string
          nullable: true
      description: Fields to update on a Salesforce Opportunity. All fields are optional.
