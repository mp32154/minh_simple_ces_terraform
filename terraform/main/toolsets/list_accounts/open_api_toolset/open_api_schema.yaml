    LeadSummary:
      type: object
      properties:
        Id:
          type: string
          readOnly: true
        Name:
          type: string
          readOnly: true
        Company:
          type: string
          nullable: true
        Status:
          type: string
          nullable: true
        Email:
          type: string
          nullable: true
        Phone:
          type: string
          nullable: true
      description: A summary of a Salesforce Lead record for list views.
    Opportunity:
      type: object
      properties:
        Id:
          type: string
          readOnly: true
        AccountId:
          type: string
          readOnly: true
        Name:
          type: string
        StageName:
          type: string
        Amount:
          type: number
          nullable: true
        Probability:
          type: number
          nullable: true
          readOnly: true
        CloseDate:
