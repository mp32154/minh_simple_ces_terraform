  /query:
    get:
      tags:
      - SOQL Query
      summary: Executes a SOQL query.
      description: |
        Retrieves records from Salesforce using a SOQL query.
        CRITICAL: Before using this tool, you MUST follow these rules:
          - For getting a record by its specific 18-character ID, you MUST use the simple 'get...ById' tool. Do NOT use this SOQL tool for that purpose.
          - For listing the direct children of a parent record (e.g., listing all Order Items for an Order ID), you MUST use the simple 'list...By...Id' tool if it exists.
          - For creating, updating, or deleting records, ALWAYS use the 'create...', 'update...', or 'delete...' tools.
          - Only use this SOQL tool for all other complex searches, like finding a record by name, number, or other non-ID fields.

        Rule for Disambiguating "Number" vs. "ID":
          - A user may not know the technical difference between a system ID and a business number and might use the terms interchangeably. You MUST ignore the user's terminology and make your decision based on the format of the value provided.
          - If the value is an 18-character alphanumeric string, it is a system ID. Do NOT use this SOQL tool; you MUST use the appropriate 'get...ById' REST tool instead.
          - If the value is in any other format (e.g., an 8-digit number), it is a business number, and you use this SOQL tool to query the specific number field (e.g., WHERE OrderNumber = '...').

        Rule for Following Examples: When a user's request matches one of the specific search examples, you MUST use the exact SELECT clause provided in that example unless the user asks for more specific information.
        Rule for Selecting Fields (Minimal by Default): Your primary goal is to select the minimal set of fields from the examples. You must ONLY add extra fields, especially from related objects (e.g., Owner.Name, Account.Name), if the user explicitly asks for that additional information.
        Guide to Commonly Used Fields: You should prefer to use fields from this list. You may use other standard fields if you are confident they exist, but do NOT invent field names. - Available Account Fields: AccountNumber, BillingCity, BillingCountry, BillingPostalCode, BillingState, BillingStreet, Description, Id, Industry, Name, Phone, ShippingCity, ShippingCountry, ShippingPostalCode, ShippingState, ShippingStreet, Type, Website - Available Asset Fields: AccountId, ContactId, Description, Id, InstallDate, Name, Price, Product2Id, PurchaseDate, Quantity, SerialNumber, Status, UsageEndDate - Available Campaign Fields: ActualCost, BudgetedCost, Description, EndDate, ExpectedRevenue, Id, IsActive, Name, ParentId, StartDate, Status, Type - Available Case Fields: AccountId, CaseNumber, ContactId, Description, Id, Origin, Priority, Status, Subject, Type - Available Contact Fields: AccountId, Department, Description, Email, FirstName, Id, LastName, MailingCity, MailingCountry, MailingPostalCode, MailingState, MailingStreet, MobilePhone, Name, Phone, Title - Available Contract Fields: AccountId, BillingCity, BillingCountry, BillingPostalCode, BillingState, BillingStreet, ContractNumber, ContractTerm, EndDate, Id, Pricebook2Id, StartDate, Status - Available Event Fields: Description, EndDateTime, Id, IsAllDayEvent, Location, OwnerId, StartDateTime, Subject, Type, WhatId, WhoId - Available KnowledgeArticleVersion Fields: ArticleNumber, Id, PublishStatus, Summary, Title, UrlName, VersionNumber - Available Lead Fields: Company, Country, City, Email, FirstName, Id, LastName, LeadSource, Name, Phone, PostalCode, Rating, State, Status, Street, Title, Website - Available Opportunity Fields: AccountId, Amount, CampaignId, CloseDate, Description, Id, LeadSource, Name, Pricebook2Id, StageName, Type - Available Order Fields: AccountId, BillingCity, BillingCountry, BillingPostalCode, BillingState, BillingStreet, ContractId, EffectiveDate, Id, OpportunityId, OrderNumber, PoNumber, Pricebook2Id, Status, TotalAmount - Available OrderItem Fields: Description, Id, OrderId, PricebookEntryId, Product2Id, Quantity, ServiceDate, TotalPrice, UnitPrice - Available Payment Fields: AccountId, Amount, Date, EffectiveDate, Id, PaymentMethodId, PaymentNumber, ProcessingMode, Status, Type - Available Pricebook2 Fields: Description, Id, IsActive, IsStandard, Name - Available PricebookEntry Fields: Id, IsActive, Name, Pricebook2Id, Product2Id, UnitPrice, UseStandardPrice - Available Product2 Fields: Description, Family, Id, IsActive, Name, ProductCode - Available Quote Fields: BillingCity, BillingCountry, BillingPostalCode, BillingState, BillingStreet, ContactId, Description, ExpirationDate, Id, Name, OpportunityId, Pricebook2Id, QuoteNumber, Status, Subtotal, TotalPrice - Available Task Fields: ActivityDate, Description, Id, OwnerId, Priority, Status, Subject, WhatId, WhoId - Available User Fields: Alias, Department, Email, FirstName, Id, IsActive, LastName, Name, Title, Username
        Rule for Field Mappings: - For an Account's category or type, filter on the 'Industry' field. - For a Product's category, filter on the 'Family' field. - For an Opportunity's stage or status, filter on the 'StageName' field. - For Task and Event objects, be specific about relationships: 'Who' (WhoId) refers to a person (Contact/Lead), 'What' (WhatId) refers to an object (Account/Opportunity), and 'Assigned To' or 'Owner' refers to the 'Owner'.
        Important: You MUST explicitly list all desired fields. SELECT * is not supported.
        Examples for Listing All Records: - Account: SELECT Id, Name, Phone, AccountNumber, Industry FROM Account - Asset: SELECT Id, Name, SerialNumber, Status FROM Asset - Campaign: SELECT Id, Name, Type, Status, StartDate, EndDate FROM Campaign - Case: SELECT Id, CaseNumber, Subject, Status, Priority FROM Case - Contact: SELECT Id, Name, Email, Phone, Title FROM Contact - Contract: SELECT Id, ContractNumber, Status, StartDate, EndDate FROM Contract - Event: SELECT Id, Subject, StartDateTime, EndDateTime, Location FROM Event - KnowledgeArticleVersion: SELECT Id, Title, ArticleNumber, UrlName FROM Knowledge__kav - Lead: SELECT Id, Name, Company, Status, Email, Phone FROM Lead - Opportunity: SELECT Id, Name, StageName, Amount, CloseDate FROM Opportunity - Order: SELECT Id, OrderNumber, Status, EffectiveDate, TotalAmount FROM Order - OrderItem: SELECT Id, Quantity, UnitPrice, TotalPrice FROM OrderItem - Payment: SELECT Id, Amount, Status, Date, Type, Account.Name FROM Payment - Pricebook2: SELECT Id, Name, IsActive, Description FROM Pricebook2 - PricebookEntry: SELECT Id, Name, UnitPrice, IsActive FROM PricebookEntry - Product2: SELECT Id, Name, ProductCode, Description, IsActive FROM Product2 - Quote: SELECT Id, Name, QuoteNumber, Status, TotalPrice, Opportunity.Name FROM Quote - Task: SELECT Id, Subject, Status, Priority, ActivityDate FROM Task - User: SELECT Id, Name, Email, Title, IsActive FROM User
        Examples for Specific Searches: - Get Account by Name: SELECT Id, Name, Phone, AccountNumber, Website, Type, Industry, Description, BillingStreet, BillingCity, BillingState, BillingPostalCode, BillingCountry, ShippingStreet, ShippingCity, ShippingState, ShippingPostalCode, ShippingCountry FROM Account WHERE Name LIKE '%YourAccountName%' - Get Account by Account Number: SELECT Id, Name, Phone, AccountNumber, Website, Type, Industry, Description, BillingStreet, BillingCity, BillingState, BillingPostalCode, BillingCountry, ShippingStreet, ShippingCity, ShippingState, ShippingPostalCode, ShippingCountry FROM Account WHERE AccountNumber = 'YourAccountNumber' - Get Asset by Name: SELECT Name, Status, Product2.Name, Price, Account.Name, Quantity, Contact.Name, PurchaseDate, InstallDate, SerialNumber, Description, UsageEndDate FROM Asset WHERE Name LIKE '%YourAssetName%' - Get Asset by Serial Number: SELECT Name, Status, Product2.Name, Price, Account.Name, Quantity, Contact.Name, PurchaseDate, InstallDate, SerialNumber, Description, UsageEndDate FROM Asset WHERE SerialNumber = 'YourSerialNumber' - Get Campaign by Name: SELECT Id, Name, Type, Status, StartDate, EndDate, IsActive, Description FROM Campaign WHERE Name LIKE '%YourCampaignName%' - Get Case by Case Number: SELECT Id, CaseNumber, Subject, Description, Status, Priority, Type, Contact.Name, Contact.Email, Contact.Phone FROM Case WHERE CaseNumber = 'YourCaseNumber' - Get Case by Description Keywords: SELECT Id, CaseNumber, Subject, Description, Status, Priority, Type, Contact.Name, Contact.Email, Contact.Phone FROM Case WHERE Description LIKE '%YourKeywords%' - Get Contact by Name: SELECT Id, Name, Email, Phone, Title, Description, MobilePhone, Department, MailingStreet, MailingCity, MailingState, MailingPostalCode, MailingCountry FROM Contact WHERE Name = 'YourContactName' - Get Contacts by Account Name: SELECT Id, Name, Email, Phone, Title, Description, MobilePhone, Department, MailingStreet, MailingCity, MailingState, MailingPostalCode, MailingCountry FROM Contact WHERE AccountId IN (SELECT Id FROM Account WHERE Name LIKE '%YourAccountName%') - Get Contract by Contract Number: SELECT Id, ContractNumber, Status, StartDate, EndDate, BillingStreet, BillingCity, BillingState, BillingPostalCode, BillingCountry FROM Contract WHERE ContractNumber = 'YourContractNumber' - Get Contracts by Account Name: SELECT Id, ContractNumber, Status, StartDate, EndDate, Account.Name, BillingStreet, BillingCity, BillingState, BillingPostalCode, BillingCountry FROM Contract WHERE AccountId IN (SELECT Id FROM Account WHERE Name LIKE '%YourAccountName%') - Get Event by Subject: SELECT Subject, StartDateTime, EndDateTime, Location, WhoId, WhatId, OwnerId FROM Event WHERE Subject LIKE '%YourSubjectKeywords%' - Get Lead by Name: SELECT Id, Name, Company, Status, Email, Phone FROM Lead WHERE Name = 'YourLeadName' - Get Lead by Company: SELECT Id, Name, Company, Status, Email, Phone FROM Lead WHERE Company LIKE '%YourCompanyName%' - Get Opportunity by Name: SELECT Id, Name, StageName, Amount, CloseDate, Type, Description, Account.Name, Campaign.Name FROM Opportunity WHERE Name LIKE '%YourOpportunityName%' - Get Opportunities by Account Name: SELECT Id, Name, StageName, Amount, CloseDate, Type, Description, Account.Name FROM Opportunity WHERE AccountId IN (SELECT Id FROM Account WHERE Name LIKE '%YourAccountName%') - Get Opportunities by Owner Name: SELECT Id, Name, StageName, Amount, CloseDate, Type, Description, Owner.Name FROM Opportunity WHERE Owner.Name = 'YourOwnerName' - Get Order by Order Number: SELECT Id, OrderNumber, Status, EffectiveDate, TotalAmount, Account.Name, (SELECT PricebookEntry.Name, Quantity, UnitPrice, TotalPrice FROM OrderItems) FROM Order WHERE OrderNumber = 'YourOrderNumber' - Get Payments by Account Name: SELECT Id, Amount, Status, Date, Type, Account.Name FROM Payment WHERE Account.Name LIKE '%YourAccountName%' - Get Knowledge Article by Title: SELECT Id, Title, ArticleNumber, UrlName, Summary FROM Knowledge__kav WHERE Title LIKE '%YourArticleTitle%' - Get Product by Name: SELECT Id, Name, ProductCode, Description, Family, IsActive FROM Product2 WHERE Name LIKE '%YourProductName%' - Get Product by Product Code: SELECT Id, Name, ProductCode, Description, IsActive FROM Product2 WHERE ProductCode = 'YourProductCode' - Get Product by Description: SELECT Id, Name, ProductCode, Description, Family, IsActive FROM Product2 WHERE Description LIKE '%YourDescription%' - Get Product by Family: SELECT Id, Name, ProductCode, Description, Family, IsActive FROM Product2 WHERE Family LIKE '%YourFamily%' - Get Price Book by Name: SELECT Id, Name, Description, IsActive, IsStandard FROM Pricebook2 WHERE Name LIKE '%YourPricebookName%' - Get Price Book by Description: SELECT Id, Name, Description, IsActive, IsStandard FROM Pricebook2 WHERE Description LIKE '%YourDescriptionKeywords%' - Get Quote by Name: SELECT Id, Name, QuoteNumber, Status, TotalPrice, Opportunity.Name, Opportunity.Account.Name FROM Quote WHERE Name LIKE '%YourQuoteName%' - Get Quote by Quote Number: SELECT Id, Name, QuoteNumber, Status, TotalPrice, Opportunity.Name FROM Quote WHERE QuoteNumber = 'YourQuoteNumber' - Get Task by Subject: SELECT Subject, Status, Priority, ActivityDate, WhoId, WhatId, OwnerId FROM Task WHERE Subject LIKE '%YourSubjectKeywords%'
      operationId: executeSoqlQuery
      parameters:
      - name: q
        in: query
        description: A URL-encoded SOQL query string constructed by the agent based
          on the user's request and the rules above.
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Successful query execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          description: Bad Request - Invalid SOQL query syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Account:
      type: object
      properties:
        Id:
          type: string
          description: The unique, unchangeable 18-character system identifier for
            the Account record.
          readOnly: true
        Name:
          type: string
          description: The official, legal name of the account or company.
          nullable: true
        AccountNumber:
          type: string
          description: A user-defined number or code for the account, used for business
            or accounting purposes. This is different from the system 'Id'.
          nullable: true
        Phone:
          type: string
          description: The primary phone number for the account.
          nullable: true
        Type:
          type: string
          description: The category of the account, such as 'Prospect', 'Customer
            - Direct', 'Customer - Channel', 'Technology Partner'.
          nullable: true
        OwnerId:
          type: string
          description: The 18-character ID of the User who owns or manages this account
            record.
          readOnly: true
        CreatedDate:
          type: string
          description: The date and time when this account record was first created
            in the system (in UTC).
          format: date-time
          readOnly: true
        LastModifiedDate:
          type: string
          description: The date and time when this account record was last modified
            (in UTC).
          format: date-time
          readOnly: true
        BillingAddress:
          $ref: '#/components/schemas/AccountAddress'
        ShippingAddress:
          $ref: '#/components/schemas/AccountAddress'
      description: Represents a full Salesforce Account record, which is typically
        a company, organization, or customer that you do business with.
    AccountAddress:
      type: object
      properties:
        city:
          type: string
          description: The city part of the address.
          nullable: true
        country:
          type: string
          description: The country part of the address.
          nullable: true
        postalCode:
          type: string
          description: The postal or ZIP code part of the address.
          nullable: true
        state:
          type: string
          description: The state, province, or region part of the address.
          nullable: true
        street:
          type: string
          description: The street name and number part of the address.
          nullable: true
      description: A structured object containing the components of a physical address
        for an Account, used for either billing or shipping.
    AccountInput:
      required:
      - Name
      type: object
      properties:
        Name:
          type: string
          description: The name of the Account.
        AccountNumber:
          type: string
          description: The account number.
          nullable: true
        BillingCity:
          type: string
          description: The city of the billing address.
          nullable: true
        BillingCountry:
          type: string
          description: The country of the billing address.
          nullable: true
        BillingPostalCode:
          type: string
          description: The postal code of the billing address.
          nullable: true
        BillingState:
          type: string
          description: The state of the billing address.
          nullable: true
        BillingStreet:
          type: string
          description: The street of the billing address.
          nullable: true
        Phone:
          type: string
          description: The primary phone number.
          nullable: true
      description: Schema for creating or updating an Account. The Name field is required.
        All other fields are optional.
    AccountUpdateInput:
      type: object
      properties:
        Name:
          type: string
          description: The new legal name of the Account. The existing name will be
            overwritten with this value.
        AccountNumber:
          type: string
          description: The new user-defined number or code for the account. This will
            overwrite the existing account number.
          nullable: true
        BillingCity:
          type: string
          description: The new city for the account's billing address.
          nullable: true
        BillingCountry:
          type: string
          description: The new country for the account's billing address.
          nullable: true
        BillingPostalCode:
          type: string
          description: The new postal or ZIP code for the account's billing address.
          nullable: true
        BillingState:
          type: string
          description: The new state, province, or region for the account's billing
            address.
          nullable: true
        BillingStreet:
          type: string
          description: The new street name and number for the account's billing address.
          nullable: true
        Phone:
          type: string
          description: The new primary phone number for the account. This will overwrite
            the existing phone number.
          nullable: true
      description: A schema containing the fields that can be updated on a Salesforce
        Account. All fields are optional; only include the fields that the user wants
        to modify.
    AccountListResponse:
      type: object
      properties:
        recentItems:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    ErrorResponse:
      type: array
      items:
        type: object
        properties:
          errorCode:
            type: string
          message:
            type: string
    CreateSuccessResponse:
      type: object
      properties:
        id:
          type: string
          description: The 18-character ID of the newly created record.
        success:
          type: boolean
          description: Indicates if the operation was successful.
        errors:
          type: array
          items:
            type: object
    Contact:
      type: object
      properties:
        Id:
          type: string
          description: The unique, unchangeable 18-character system identifier for
            the Contact record.
          readOnly: true
        AccountId:
          type: string
          description: The 18-character ID of the Account (company) this contact is
            associated with.
          readOnly: true
        Name:
          type: string
          description: The full name of the contact, automatically combining the First
            Name and Last Name.
          readOnly: true
        FirstName:
          type: string
          description: The first name of the contact.
          nullable: true
        LastName:
          type: string
          description: The last name of the contact.
          nullable: true
        Email:
          type: string
          description: The primary email address for the contact.
          nullable: true
        Phone:
          type: string
          description: The primary business phone number for the contact.
          nullable: true
        Title:
          type: string
          description: The job title of the contact (e.g., 'CEO', 'Sales Manager').
          nullable: true
        Department:
          type: string
          description: The department the contact works in (e.g., 'Sales', 'Marketing',
            'IT').
          nullable: true
        CreatedDate:
          type: string
          description: The date and time when this contact record was first created
            in the system (in UTC).
          format: date-time
          readOnly: true
        LastModifiedDate:
          type: string
          description: The date and time when this contact record was last modified
            (in UTC).
          format: date-time
          readOnly: true
      description: Represents a Salesforce Contact, who is an individual person associated
        with an Account.
    ContactInput:
      required:
      - LastName
      type: object
      properties:
        AccountId:
          type: string
          description: The ID of the Account this contact is associated with.
        LastName:
          type: string
          description: The last name of the contact.
        FirstName:
          type: string
          description: The first name of the contact.
          nullable: true
        Email:
          type: string
          description: The email address for the contact.
          nullable: true
        Phone:
          type: string
          description: The primary phone number for the contact.
          nullable: true
        Title:
          type: string
          description: The contact's title, e.g., 'VP of Engineering'.
          nullable: true
        Department:
          type: string
          description: The department the contact works in.
          nullable: true
      description: Data to create a Salesforce Contact.
    ContactUpdateInput:
      type: object
      properties:
        LastName:
          type: string
          description: The last name of the contact.
        FirstName:
          type: string
          description: The first name of the contact.
          nullable: true
        Email:
          type: string
          description: The email address for the contact.
          nullable: true
        Phone:
          type: string
          description: The primary phone number for the contact.
          nullable: true
        Title:
          type: string
          description: The contact's title, e.g., 'VP of Engineering'.
          nullable: true
        Department:
          type: string
          description: The department the contact works in.
          nullable: true
      description: Fields to update on a Salesforce Contact. All fields are optional.
    ContactListResponse:
      type: object
      properties:
        totalSize:
          type: integer
        done:
          type: boolean
        records:
          type: array
          items:
            $ref: '#/components/schemas/ContactSummary'
    ContactSummary:
      type: object
      properties:
        Id:
          type: string
          readOnly: true
        Name:
          type: string
          readOnly: true
        Email:
          type: string
          nullable: true
        Phone:
          type: string
          nullable: true
        Title:
          type: string
          nullable: true
      description: A summary of a Salesforce Contact record for list views.
    Lead:
      type: object
      properties:
        Id:
          type: string
          readOnly: true
        Name:
          type: string
          readOnly: true
        FirstName:
          type: string
          nullable: true
        LastName:
          type: string
          nullable: true
        Company:
          type: string
        Status:
          type: string
          nullable: true
        Phone:
          type: string
          nullable: true
        Email:
          type: string
          nullable: true
        Title:
          type: string
          nullable: true
        Website:
          type: string
          nullable: true
        LeadSource:
          type: string
          nullable: true
        IsConverted:
          type: boolean
          readOnly: true
        OwnerId:
          type: string
          readOnly: true
        CreatedDate:
          type: string
          format: date-time
          readOnly: true
        LastModifiedDate:
          type: string
          format: date-time
          readOnly: true
        Address:
          $ref: '#/components/schemas/LeadAddress'
      description: Represents a full Salesforce Lead record.
    LeadAddress:
      type: object
      properties:
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
      description: Represents the address for a Lead.
    LeadInput:
      required:
      - Company
      - LastName
      type: object
      properties:
        Company:
          type: string
          description: The lead's company. Required.
        LastName:
          type: string
          description: The lead's last name. Required.
        Status:
          type: string
          description: The status of the lead, e.g., 'Open - Not Contacted'.
        FirstName:
          type: string
          description: 'Optional: The lead''s first name.'
          nullable: true
        Email:
          type: string
          description: 'Optional: The lead''s email address.'
          nullable: true
        Phone:
          type: string
          description: 'Optional: The lead''s primary phone number.'
          nullable: true
        LeadSource:
          type: string
          description: 'Optional: The source of the lead, e.g., ''Web'', ''Phone Inquiry''.'
          nullable: true
        Title:
          type: string
          description: 'Optional: The lead''s job title.'
          nullable: true
        Website:
          type: string
          description: 'Optional: The lead''s company website.'
          nullable: true
      description: Schema for creating a Lead. The Company, LastName fields are required.
        All other fields are optional.
    LeadUpdateInput:
      type: object
      properties:
        Company:
          type: string
          nullable: true
        LastName:
          type: string
          nullable: true
        Status:
          type: string
          nullable: true
        FirstName:
          type: string
          nullable: true
        Email:
          type: string
          nullable: true
        Phone:
          type: string
          nullable: true
        LeadSource:
          type: string
          nullable: true
        Title:
          type: string
          nullable: true
        Website:
          type: string
          nullable: true
      description: Fields to update on a Salesforce Lead. All fields are optional.
    LeadListResponse:
      type: object
      properties:
