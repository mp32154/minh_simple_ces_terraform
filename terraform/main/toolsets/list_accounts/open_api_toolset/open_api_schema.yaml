      - CloseDate
      - Name
      - StageName
      type: object
      properties:
        AccountId:
          type: string
          description: The ID of the Account this opportunity is associated with
        Name:
          type: string
          description: A name for this opportunity. Required.
        StageName:
          type: string
          description: The current stage of this opportunity, e.g., 'Prospecting',
            'Closed Won'. Required.
        CloseDate:
          type: string
          description: The expected close date for this opportunity, in YYYY-MM-DD
