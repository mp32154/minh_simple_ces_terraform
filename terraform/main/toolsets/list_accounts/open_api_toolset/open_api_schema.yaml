openapi: 3.0.3
info:
  title: CES Salesforce OpenAPI Toolset
  description: API for retrieving and creating Salesforce entities, including advanced
    querying via SOQL for non-ID and related entity lookups.
  version: v1.0.0
servers:
- url: $env_var
paths:
  /sobjects/Account:
    get:
      tags:
      - Account
      summary: List recently viewed Accounts.
      description: |
        The default tool for a general request to list accounts.
        You should prioritize this tool over SOQL unless the user asks to "list all" accounts or specifies a filter (e.g., by name or number).
        This tool retrieves a list of recently viewed or created accounts. This tool supports optional sorting and limiting.
        You MUST NOT ask for 'limit' or 'orderby' values. Only use them if a user provides terms like "top 5", "newest", or "recently updated".
        For the 'orderby' parameter, you MUST only use one of the following fields for sorting Accounts: 'CreatedDate', 'LastModifiedDate'.
        Usage Examples:
          - To find the NEWEST or OLDEST records, use 'CreatedDate':
            - User says: "show me the 5 newest accounts" -> Agent uses: limit=5, orderby='CreatedDate DESC'
            - User says: "list the 10 oldest accounts" -> Agent uses: limit=10, orderby='CreatedDate ASC'
          - To find the most RECENTLY MODIFIED records, use 'LastModifiedDate':
            - User says: "get the top 3 most recently used accounts" -> Agent uses: limit=3, orderby='LastModifiedDate DESC'
          - For a generic 'TOP' or 'BOTTOM' request, default to using 'LastModifiedDate':
            - User says: "list the top 5 accounts" -> Agent uses: limit=5, orderby='LastModifiedDate DESC'
      operationId: listAccounts
      parameters:
      - name: limit
        in: query
        description: 'Optional: The maximum number of records to return. DO NOT ask
          the user for this value. Only use it if the user explicitly specifies a
          quantity in their request.'
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: orderby
        in: query
        description: 'Optional: The field to sort by. MUST be ''CreatedDate'' or ''LastModifiedDate''.
          Only use if the user specifies an order.'
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: List of Accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        '401':
          description: Unauthorized - Invalid or missing access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Account
      summary: Create a new Account.
      description: |
        Creates a new customer account. Crucially, only the 'Name' is required.
        Do not prompt the user for other fields; only use them if the user provides them voluntarily in their query.
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
        required: true
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSuccessResponse'
        '400':
          description: Bad Request - The request is missing required fields or contains
            invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sobjects/Account/{accountId}:
    get:
      tags:
      - Account
      summary: Get an Account by ID.
      description: |
        Gets the detailed information for a single account using its 18-character ID.
        This is the primary tool for this action.
        You MUST use this tool if the user provides an 18-character alphanumeric identifier, even if they refer to it as a 'number'.
      operationId: getAccountById
      parameters:
      - name: accountId
        in: path
        description: The 18-character ID of the Account to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          pattern: ^[a-zA-Z0-9]{18}$
          type: string
      responses:
        '200':
          description: Account details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Not Found - No Account with the specified ID exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Account
      summary: Delete an Account.
      description: Deletes the account record associated with the specified accountId.
      operationId: deleteAccountById
      parameters:
      - name: accountId
        in: path
        description: The 18-character ID of the Account to delete.
        required: true
        style: simple
        explode: false
        schema:
          pattern: ^[a-zA-Z0-9]{18}$
          type: string
      responses:
        '204':
          description: Account deleted successfully. The response will have no content.
        '404':
          description: Not Found - No Account with the specified ID exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Account
      summary: Update an Account.
      description: Updates an existing account's details using its ID. Provide only
        the fields you want to change.
      operationId: updateAccountById
      parameters:
      - name: accountId
        in: path
        description: The 18-character ID of the Account to update.
        required: true
        style: simple
        explode: false
        schema:
          pattern: ^[a-zA-Z0-9]{18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateInput'
        required: true
      responses:
        '204':
          description: Account updated successfully.
        '400':
          description: Bad Request - Invalid data provided for update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found - No Account with the specified ID exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sobjects/Contact:
    post:
      tags:
      - Contact
      summary: Create a new Contact.
      description: Creates a new contact for a customer account. Requires LastName.
      operationId: createContact
      requestBody:
        content:
