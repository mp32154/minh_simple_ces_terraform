name: 'Terraform Dev'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  terraform:
    name: 'Terraform Dev'
    runs-on: 'ubuntu-latest'
    environment: dev # Target the dev GitHub Environment

    defaults:
      run:
        working-directory: ./terraform/dev

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Authenticate to Google Cloud using dev secrets
    - name: Google Auth (WIF)
      id: auth-wif
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
      continue-on-error: true

    # Fallback to Service Account Key JSON if WIF is not configured
    - name: Google Auth (Key JSON)
      if: steps.auth-wif.outcome == 'failure'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # Install Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # Initialize Terraform
    - name: Terraform Init
      run: terraform init

    # Check formatting (optional)
    - name: Terraform Format
      run: terraform fmt -check
      continue-on-error: true

    # Generate Plan
    - name: Terraform Plan
      run: terraform plan -input=false

    # Apply changes (Only on push to main)
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false
